<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="末末記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>末末記帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：底部分頁 → 日曆（兩週、可翻週、可展開整月）／帳戶總覽（分組＋應收應付）→ 下鑽逐月明細 */
:root{
  --bg:#f6f4ef; --card:#fffdfa; --sunk:#edeae3; --line:#ddd8cd; --line-2:#e8e4db;
  --fg:#1c2230; --fg-2:#4a5264; --fg-3:#7b8294;
  --pos:#2f6b4f; --neg:#a3303a; --accent:#b8651a; --accent-soft:#f7e2c8;
  --flag:#8a6d1f; --flag-soft:#f6ecd0;
  --pj:#b5537f; --ac:#2d7f93; --cl:#7a5bb5; --cl-soft:#efe8f8;
  --f-body:"Noto Sans TC","Helvetica Neue",sans-serif;
  --nav-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161d; --card:#1b1f28; --sunk:#232834; --line:#333a48; --line-2:#272d39;
  --fg:#e8e9ec; --fg-2:#a8adbb; --fg-3:#757c8c;
  --pos:#7cc49c; --neg:#e58a92; --accent:#e39a55; --accent-soft:#3d2d1b;
  --flag:#d8bb6a; --flag-soft:#38301a;
  --pj:#e08bb0; --ac:#6cc3d6; --cl:#b9a3e6; --cl-soft:#2a2438;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13161d; --card:#1b1f28; --sunk:#232834; --line:#333a48; --line-2:#272d39;
  --fg:#e8e9ec; --fg-2:#a8adbb; --fg-3:#757c8c;
  --pos:#7cc49c; --neg:#e58a92; --accent:#e39a55; --accent-soft:#3d2d1b;
  --flag:#d8bb6a; --flag-soft:#38301a;
  --pj:#e08bb0; --ac:#6cc3d6; --cl:#b9a3e6; --cl-soft:#2a2438;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px))}
.app.full{max-width:none}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0 11px;border-bottom:1px solid var(--line-2)}
.bar h1{font-size:16px;font-weight:700;margin:0}
.side{display:flex;gap:7px}
.iconbtn{appearance:none;width:33px;height:33px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg-2);font:inherit;font-size:14px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.iconbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* 日曆 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px 10px;margin-top:13px}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 9px}
.calhd .rng{appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--fg);cursor:pointer;padding:4px 9px;border-radius:8px;display:flex;align-items:center;gap:5px}
.calhd .rng:hover{background:var(--sunk)}
.calhd .rng .car{font-size:10px;color:var(--fg-3)}
.calhd .rng.open{background:var(--accent-soft);color:var(--accent)}
.arw{appearance:none;border:0;background:none;color:var(--fg-2);font-size:19px;cursor:pointer;padding:3px 11px;border-radius:7px;line-height:1}
.arw:hover{background:var(--sunk)}
.arw:focus-visible,.calhd .rng:focus-visible{outline:2px solid var(--accent)}
.dow,.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow div{text-align:center;font-size:11px;color:var(--fg-3);padding-bottom:5px}
.dow div:first-child,.dow div:last-child{color:var(--neg)}
.day{appearance:none;border:0;background:none;font:inherit;color:inherit;cursor:pointer;border-radius:9px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:42px}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.day .dd{font-size:14px;font-weight:500;width:27px;height:27px;display:grid;place-items:center;border-radius:50%}
.day.we .dd{color:var(--neg)}
.day.out .dd{opacity:.32}
.day.today .dd{border:1.5px solid var(--accent);color:var(--accent)}
.day.sel{background:var(--accent-soft)}
.day.sel .dd{background:var(--accent);color:#fff;border-color:var(--accent)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--fg-3);opacity:.55}
.day.sel .dot{background:var(--accent);opacity:1}
.dot.hide{visibility:hidden}
.wkrow{display:grid;grid-template-columns:1fr;gap:3px;border-radius:9px;cursor:pointer}
.wkrow:hover{background:var(--sunk)}
.monthhint{font-size:11px;color:var(--fg-3);text-align:center;padding:7px 0 2px}

/* 區塊標題 */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;gap:10px;flex-wrap:wrap}
.sec .t{font-size:13.5px;font-weight:700}
.sec .s{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.sec .s .sep{color:var(--line);font-weight:300}
.sec .s .o{color:var(--neg);font-weight:500}
.sec .s .i{color:var(--pos);font-weight:500}
/* 統計頁的段落標題：色塊＋左側色條，段落之間留白 */
.stw .sec{margin:26px 0 10px;padding:9px 12px;background:var(--sunk);border-radius:10px;box-shadow:inset 4px 0 0 var(--accent);align-items:center}
.stw .sec .t{font-size:14px;letter-spacing:.02em}
.stw .sec:first-child{margin-top:8px}

/* 交易列（參照 MOZE 版面） */
.list{display:flex;flex-direction:column;gap:2px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:11px;align-items:center;
  background:var(--card);border-bottom:1px solid var(--line-2);padding:11px 12px;border-radius:0}
.rec:first-child{border-radius:12px 12px 0 0}
.rec:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.rec:only-child{border-radius:12px}
.rec.ok{background:color-mix(in srgb,var(--pos) 9%,var(--card))}
.rec.flag{background:var(--flag-soft)}
.rec.man{box-shadow:inset 3px 0 0 var(--accent)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rc{min-width:0}
.rn{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.rn{display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:2px;white-space:normal;overflow:visible}
.rtt{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.rmeta .tg.mc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rn .tg.mc{font-size:10.5px;padding:1px 7px;font-weight:500;letter-spacing:0}
.rcat{font-size:11.5px;font-weight:700;color:var(--fg-3);letter-spacing:0;white-space:nowrap}
.rcat::before{content:"｜";font-weight:400;margin-right:4px;opacity:.6}
.rs{font-size:12.5px;color:var(--fg-3);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.ra{text-align:right;flex:0 0 auto;max-width:52vw;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rv{font-weight:600;font-size:17px;letter-spacing:-.01em}
.rv.p{color:var(--pos)} .rv.n{color:var(--neg)} .rv.z{color:var(--pos)}
.rt{font-size:10.5px;color:var(--fg-3)}
.rtags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--fg-3);white-space:nowrap;line-height:1.5}
.tg.pj{border-color:var(--pj);color:var(--pj)}
.tg.ac{border-color:var(--ac);color:var(--ac)}
.chk{appearance:none;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg-3);font:inherit;font-size:15px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk.ok{background:var(--pos);border-color:var(--pos);color:#fff}
.chk.flag{background:var(--flag);border-color:var(--flag);color:#fff}

/* 帳戶 */
.grp{margin-top:16px}
.grph{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px 7px;border-bottom:1px solid var(--line-2);margin-bottom:7px}
.grph .g{font-size:12.5px;color:var(--fg-2);font-weight:500}
.grph .gt{font-size:12.5px;color:var(--fg-3)}
.acct{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:5px;cursor:pointer;width:100%;appearance:none;font:inherit;color:inherit;text-align:left}
.acct:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acct .ai{width:36px;height:36px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.acct.arap .ai{background:var(--accent-soft);color:var(--accent)}
.acct .an{font-size:14px;font-weight:500}
.acct .al{font-size:11px;color:var(--fg-3);margin-top:1px}
.acct .av{font-weight:600;font-size:15px}

/* 月份導覽 */
.mnav{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin-top:13px}
.mnav .mv{font-size:14px;font-weight:600;min-width:150px;text-align:center}
.mnav{flex-wrap:wrap}
.mnav button.iconbtn{width:33px;height:33px;padding:0;border:1px solid var(--line);background:var(--card);border-radius:50%}
.mnav button.iconbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mnav button{appearance:none;border:0;background:none;color:var(--fg-2);font-size:19px;cursor:pointer;padding:2px 10px;border-radius:7px;line-height:1}
.mnav button:disabled{opacity:.25;cursor:default}
.mnav button:focus-visible{outline:2px solid var(--accent)}

/* 補記表單 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(10,12,18,.5);display:grid;place-items:end center;padding:0}
.sheetin{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheetin h3{margin:0 0 3px;font-size:15.5px}
.sheetin .sh{font-size:11.5px;color:var(--fg-3);margin-bottom:13px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--fg-2);margin-bottom:3px}
.fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.empty{text-align:center;padding:34px 18px;color:var(--fg-3);font-size:13px}
.empty b{display:block;color:var(--fg-2);font-size:14.5px;font-weight:500;margin-bottom:4px}
.note{font-size:11px;color:var(--fg-3);margin-top:12px;padding:9px 11px;background:var(--sunk);border-radius:9px;line-height:1.55}
.more{appearance:none;width:100%;margin-top:9px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--fg-2);font:inherit;font-size:12.5px;cursor:pointer}
.sync{font-size:10.5px;color:var(--fg-3);padding:3px 9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.sync.on{color:var(--pos)} .sync.off{color:var(--accent)}

/* 核對頁 */
.proof{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:13px}
.proof h3{margin:0 0 9px;font-size:14px}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab td{padding:5px 2px;border-bottom:1px solid var(--line-2)}
.ptab td:last-child{text-align:right;font-weight:600}
.ptab tr:last-child td{border-bottom:0}
.ptab .eq td{color:var(--pos)}
.ptab .hl td{font-weight:700;border-top:1.5px solid var(--line)}
.added{background:var(--accent-soft);border:1px solid var(--accent);border-radius:11px;padding:11px 14px;margin:6px 0}
.added .ak{font-weight:600;font-size:13.5px;color:var(--accent);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.added .ak .av{font-weight:500}
.added .as{font-size:11.5px;color:var(--fg-2);margin-top:4px}
.added .as b{color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent);color:#fff;margin-right:6px}
.badge.ok{background:var(--pos)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:9px 0;border-bottom:1px solid var(--line-2);margin-top:14px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit;font-size:13.5px}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fsel{display:flex;gap:7px;margin-top:7px}
.fsel select{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:12.5px}
.vrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px}
.vrow .vh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.vrow .vid{color:var(--fg-3);font-size:11px}
.vrow .vn{font-weight:600;font-size:13.5px}
.vrow .vv{font-weight:700;font-size:14px}
.vrow .vv.p{color:var(--pos)} .vrow .vv.n{color:var(--neg)}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:3px 12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line-2)}
.vg div{font-size:11.5px;color:var(--fg-2);min-width:0}
.vg div b{color:var(--fg-3);font-weight:400}
.vg div span{word-break:break-all}
.vds{font-size:11px;color:var(--fg-3);margin-top:5px;padding-top:5px;border-top:1px solid var(--line-2);white-space:pre-wrap;max-height:88px;overflow:auto}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav button{flex:1;appearance:none;border:0;background:none;font:inherit;color:var(--fg-3);cursor:pointer;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
nav button[aria-current="true"]{color:var(--accent)}
nav button .g{font-size:17px;line-height:1}
nav .add{flex:0 0 auto;width:54px;height:54px;margin:0 6px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;border:0;cursor:pointer;display:grid;place-items:center;line-height:1;padding-bottom:3px;box-shadow:0 2px 10px rgba(0,0,0,.18)}

/* 試算表連線 */
button.sync{appearance:none;font:inherit;font-size:10.5px;cursor:pointer}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--flag-soft);color:var(--flag);border:1px solid color-mix(in srgb,var(--flag) 40%,transparent);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:12px;line-height:1.5}
.banner button{appearance:none;flex:0 0 auto;border:1px solid var(--flag);background:var(--card);color:var(--flag);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:12.5px;z-index:80;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 待決事項 */
.pd{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--neg);border-radius:11px;padding:11px 13px;margin:6px 0}
.pd .ph{display:flex;gap:8px;align-items:baseline}
.pd .pno{font-size:11.5px;color:var(--fg-3);flex:0 0 auto}
.pd .pi{font-weight:600;font-size:14px;flex:1;min-width:0}
.pd .pst{font-size:11px;font-weight:600;color:var(--neg);flex:0 0 auto;white-space:nowrap}
.pd .pst.mid{color:var(--flag)} .pd .pst.ok{color:var(--pos)}
.pd .pdesc{font-size:12.5px;color:var(--fg-2);margin-top:4px;line-height:1.55}
.pd .pdate{font-size:11px;color:var(--fg-3);margin-top:4px}
.pok{appearance:none;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg-2);border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.pok.armed{background:var(--pos);border-color:var(--pos);color:#fff}
.pd.done{border-left-color:var(--pos);background:var(--sunk);opacity:.78}
.pd.done .pi,.pd.done .pdesc{text-decoration:line-through;text-decoration-color:var(--fg-3);color:var(--fg-3)}
/* 逐筆檢視：每日全選 */
.dayh{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:0 12px 0 4px}
.dayh .dt{font-weight:700;font-size:13px}
.dayh .dc{font-size:11.5px;color:var(--fg-3);flex:1}
.chk.part{background:color-mix(in srgb,var(--pos) 18%,var(--bg));border-color:var(--pos);color:var(--pos)}

/* 商家、外幣、Claude補記 */
.tg.mc{border-color:var(--line);color:var(--fg-2);background:var(--sunk)}
.tg.cl{border-color:var(--cl);color:var(--cl);background:var(--cl-soft)}
.rec.cl{box-shadow:inset 3px 0 0 var(--cl);background:color-mix(in srgb,var(--cl) 6%,var(--card))}
.rec.cl.ok{background:color-mix(in srgb,var(--pos) 9%,var(--card))}
.rec[data-open]{cursor:pointer}
.fxb{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg-2);font:inherit;font-size:11px;line-height:1;padding:3px 6px;border-radius:999px;cursor:pointer;margin-top:3px}

  let r; try{ r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:cfg.token,tool,input}),redirect:"follow"}); }
  catch(e){ throw {code:"network",retryable:true}; }
  let j; try{ j=await r.json(); }catch(e){ throw {code:"server_unavailable",retryable:true}; }
  if(!j.ok) throw {code:j.code||"tool_error",message:j.message||""};
  return {payload:j.payload}; }

function rdBatch(range){ return new Promise((res,rej)=>{ if(!RDQ){ RDQ=[]; setTimeout(async()=>{ const q=RDQ; RDQ=null;
      try{ const r=await apiPost("batch_get",{ranges:q.map(x=>x.range)}); const vs=(r.payload&&r.payload.valueRanges)||[]; q.forEach((x,k)=>x.res(vs[k]||[])); }
      catch(e){ if(q.length===1){ q[0].rej(e); return; }
        for(const x of q){ try{ const r1=await apiPost("get_values",{range:x.range}); x.res((r1.payload&&r1.payload.values)||[]); }catch(e1){ x.rej(e1); } } } },0); }
    RDQ.push({range,res,rej}); }); }

/* ── PIN 鎖：4–6 位數字，只存雜湊在這台裝置 ── */
const PINK="mmjz.pin", LMK="mmjz.lockmin";
const lockMin=()=>{ const v=Number((getPin()||{}).lockMin||localStorage.getItem(LMK)||5); return Math.min(60,Math.max(1,v||5)); };
const getPin=()=>{ try{ return JSON.parse(localStorage.getItem(PINK)||"null"); }catch(e){ return null; } };
async function pinHash(pin,salt){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+"|"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function pinStore(pin){ const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const o={salt,h:await pinHash(pin,salt),lockMin:lockMin(),at:Date.now()}; localStorage.setItem(PINK,JSON.stringify(o)); pinPush(o); }
/* 跨裝置同步：PIN 雜湊和上鎖時間存在後端（指令碼屬性），每台裝置打開時抓最新的 */
async function pinPush(o){ try{ await apiPost("pin_set",{pin:o}); }catch(e){ if(e&&e.code==="bad_tool") toast("後端還沒更新，PIN 只存在這台裝置"); } }
async function pinSync(){ if(!getCfg()) return; try{ const r=await apiPost("pin_get",{}); const rem=r.payload&&r.payload.pin, loc=getPin();
    if(rem&&rem.h){ if(!loc||loc.h!==rem.h||loc.lockMin!==rem.lockMin){ localStorage.setItem(PINK,JSON.stringify(rem)); if(!loc&&!LK) lockShow("unlock"); else if(LK&&LK.mode==="set"&&!LK.first&&!LK.buf){ lockShow("unlock"); } } }
    else if(loc&&loc.h){ pinPush(loc); } }catch(e){} }
function lockMinSet(v){ v=Math.min(60,Math.max(1,Number(v)||5)); localStorage.setItem(LMK,String(v)); const P=getPin(); if(P){ P.lockMin=v; P.at=Date.now(); localStorage.setItem(PINK,JSON.stringify(P)); pinPush(P); } toast("離開超過 "+v+" 分鐘會自動上鎖"); }

function lockShow(mode){ // mode: unlock | set | change-old | forgot

function lockHide(){ LK=null; $("lock").hidden=true; document.body.classList.remove("locked"); }
function lockPaint(){ if(!LK) return; const L=$("lock");

  const title=LK.mode==="unlock"?"輸入 PIN 解鎖":LK.mode==="change-old"?"輸入目前的 PIN":LK.first?"再輸入一次確認":"設定新的 PIN（4–6 位數字）";
  const n=Math.max(4,LK.buf.length);
  L.innerHTML=`<h2>${title}</h2><div class="ldots">${Array.from({length:LK.mode==="unlock"||LK.mode==="change-old"?Math.max(4,LK.buf.length):6},(_,k)=>`<i class="${k<LK.buf.length?"f":""}"></i>`).join("")}</div>
    <div class="lsub ${LK.msg?"err":""}">${esc(LK.msg||(LK.mode==="set"&&!LK.first?"打 4–6 位數字後按「確定」":""))}</div>

      <button class="t" data-lk="bs">刪除</button><button data-lk="0">0</button><button class="t" data-lk="ok">確定</button></div>

async function lockKey(k){ if(!LK) return; const now=Date.now();
  if(LK.until>now){ LK.msg=`錯太多次，請等 ${Math.ceil((LK.until-now)/1000)} 秒`; lockPaint(); return; }
  if(k==="bs"){ LK.buf=LK.buf.slice(0,-1); LK.msg=""; lockPaint(); return; }
  if(/^\d$/.test(k)){ if(LK.buf.length<6) LK.buf+=k; LK.msg=""; lockPaint();
    if((LK.mode==="unlock"||LK.mode==="change-old")&&LK.buf.length>=4) await lockTry(false); return; }
  if(k==="ok") await lockTry(true); }
async function lockTry(explicit){ const P=getPin();
  if(LK.mode==="unlock"||LK.mode==="change-old"){
    if(!P){ lockHide(); return; }
    if(await pinHash(LK.buf,P.salt)===P.h){ LK.fails=0; if(LK.mode==="unlock") lockHide(); else { LK.mode="set"; LK.buf=""; LK.first=null; LK.msg=""; lockPaint(); } return; }
    if(!explicit&&LK.buf.length<6) return; // 還可能是比較長的 PIN
    LK.fails++; LK.buf=""; LK.msg="PIN 不對"; if(LK.fails>=5){ LK.until=Date.now()+30000; LK.fails=0; LK.msg="錯 5 次，請等 30 秒"; } lockPaint(); return; }
  if(LK.mode==="set"){
    if(!/^\d{4,6}$/.test(LK.buf)){ LK.msg="PIN 要 4–6 位數字"; lockPaint(); return; }
    if(!LK.first){ LK.first=LK.buf; LK.buf=""; LK.msg=""; lockPaint(); return; }
    if(LK.first!==LK.buf){ LK.first=null; LK.buf=""; LK.msg="兩次不一樣，請重新設定"; lockPaint(); return; }
    await pinStore(LK.buf); lockHide(); toast("PIN 已設定，所有裝置都會用這組；離開超過 "+lockMin()+" 分鐘會上鎖"); } }

  if(!ids.length){ toast("這個帳戶沒有要補的外幣紀錄"); return; } FQ={a,ids,done:0,total:ids.length,cur:null}; fqNext(); }
function fqNext(skip){ if(!FQ) return;
  if(skip&&FQ.cur!=null) FQ.ids=FQ.ids.filter(i=>i!==FQ.cur).concat([FQ.cur]);
  const left=FQ.ids.filter(i=>{ const t=D.tx.find(z=>z.i===i); return t&&fxMiss(t); });
  FQ.ids=left;
  if(!left.length){ const n=FQ.total; FQ=null; $("modal").innerHTML=""; ed=null; render(); toast("這個帳戶的外幣都補完了（共 "+n+" 筆）🎉"); return; }
  if(!skip&&FQ.cur!=null&&!left.includes(FQ.cur)) FQ.done++;
  FQ.cur=left[0]; openEdit(FQ.cur); }
function fqBar(){ if(!FQ||!ed||ed.isNew||!ed.subs.some(x=>x.i===FQ.cur)) return "";
  return `<div class="fqbar"><span>補台幣・<b>${esc(FQ.a)}</b>　還剩 <b>${FQ.ids.length}</b> 筆</span><span class="fqb"><button class="btn sm" id="fqskip">略過 ›</button><button class="btn sm" id="fqstop">結束</button></span></div>`; }

    ${x.i!=null&&!x.lock?`<button class="delb ${ed.delArm===ed.sel?"armed":""}" id="edel">${ed.delArm===ed.sel?"再按一次：刪除這一項":"刪除這一項"}</button>`:""}
    ${!x.i&&ed.subs.length>1?`<button class="delb" id="edel">移除這一項</button>`:""}

function feePanel(x){
  const fee=Math.abs(x.fee||0), dc=Math.abs(x.dc||0), total=x.amt-fee+dc;
  return `<div class="fpwrap" id="fpwrap"><div class="fp" role="dialog" aria-label="手續費與折扣">
    <div class="fph"><span></span><b>${esc(x.k)}</b><button class="lnk" id="fpreset">重置</button></div>
    <div class="fpr"><label for="fp-amt">金額</label><input id="fp-amt" class="ein ${x.amt<0?"n":"p"}" type="text" inputmode="decimal" value="${signFor(x.k,1)===null?x.amt:Math.abs(x.amt)||""}" placeholder="0"></div>

    <div class="fpr tot"><span>總額</span><b id="fp-tot" class="${total<0?"n":"p"}">${esc(money(total,x.cu))}</b></div>
    <div class="btns"><button class="btn" id="fpx">取消</button><button class="btn primary" id="fpok">確定</button></div>
  </div></div>`;
}
function stampNote(old,what,stamp){ old=String(old||"").replace(new RegExp("｜?"+what+" \\d{4}-\\d\\d-\\d\\d \\d\\d:\\d\\d","g"),""); return (old?old+"｜":"")+what+" "+stamp; }
async function delSub(){
  const x=ed.subs[ed.sel];
  if(!x.i){ ed.subs.splice(ed.sel,1); ed.sel=0; renderEd(); return; }
  if(ed.delArm!==ed.sel){ readEd(); ed.delArm=ed.sel; renderEd(); return; }
  if(!canWrite()) return;
  const now=new Date(), stamp=iso(now)+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const r=RAW.tx[x.row-2]; while(r.length<19) r.push("");
  const note=stampNote(r[18],"刪除",stamp);
  try{ await call("update_values",{spreadsheetId:SID,range:`交易!R${x.row}:S${x.row}`,values:[["已刪除",note]]});
    r[17]="已刪除"; r[18]=note; ed.subs.splice(ed.sel,1); ed.sel=0; ed.delArm=null;
    build(RAW); cset("sheet",RAW);
    if(!ed.subs.length){ $("modal").innerHTML=""; ed=null; } else renderEd();
    render(); toast("已標記刪除（列還在試算表，之後由 Claude 統一清理）");
  }catch(e){ toast("沒有寫入："+errMsg(e)); }
}
async function saveEd(confirmCk){
  if(!canWrite()) return; readEd();
  if(ed.xfer){ const [o,i]=ed.subs; if(!o.a||!i.a){ toast("請選好轉出和轉入帳戶"); return; } if(o.a===i.a){ toast("轉出和轉入不能是同一個帳戶"); return; }
    if(!o.amt||!i.amt){ toast("請輸入金額"); return; } o.k="轉出"; i.k="轉入"; o.ob=i.ob=""; }
  const btn=$("esave"); if(btn) btn.disabled=true;
  try{
    const now=new Date(), stamp=iso(now)+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    let next=ed.subs.some(x=>!x.row)?await freshSeq():nextSeq(), appended=false, changed=false;
    const adds=[];
    for(const x of ed.subs){ if(x.ro&&!x.lock){ const o=D.tx.find(t=>t.i===x.ro), ri=o?refundInfo(o,x.i):null;
      if(ri&&o.cu===x.cu&&Math.abs(x.amt)>ri.left+1e-9){ if(btn) btn.disabled=false; toast("退款金額超過可退的 "+money(ri.left,o.cu)+"（原 #"+o.i+" 已退 "+money(ri.got,o.cu)+"）"); return; } } }
    for(const x of ed.subs){
      if(x.lock) continue;
      const v=rowVals(x);
      if(x.row){ if(JSON.stringify(v.concat(fxVals(x)))!==x.orig){
          const r=RAW.tx[x.row-2]; while(r.length<19) r.push("");
          const note=stampNote(r[18],"修改",stamp); changed=true;
          await call("update_values",{spreadsheetId:SID,range:`交易!B${x.row}:S${x.row}`,values:[v.concat([r[17]==null?"":r[17],note])]});
          for(let k=0;k<16;k++) r[k+1]=v[k]; r[18]=note;
          const fv=fxVals(x); if(fv[0]!==""||fv[1]!==""||fv[2]!==""||r[19]||r[20]||r[21]){ await call("update_values",{spreadsheetId:SID,range:`交易!T${x.row}:V${x.row}`,values:[fv]}); while(r.length<22) r.push(""); r[19]=fv[0]; r[20]=fv[1]; r[21]=fv[2]; } } }
      else if(x.amt||x.n){ adds.push([next++].concat(v,["","app補記 "+stamp],fxVals(x))); }
    }
    if(adds.length){ await call("append_values",{spreadsheetId:SID,range:"交易!A1:V1",values:adds}); appended=true; changed=true; }
    if(ed.ck){
      const ck=D.ck.find(c=>c.row===ed.ck), rep=ed.rep!=null?ed.rep:ck.reply;
      const st=confirmCk?"✅ 已確認":ck.st, dt=confirmCk?iso(new Date()).replace(/-/g,"/"):ck.date;
      if(confirmCk||rep!==ck.reply){
        await call("update_values",{spreadsheetId:SID,range:`核對清單!I${ed.ck}:K${ed.ck}`,values:[[st,rep,dt]]}); changed=true;
        const r=RAW.ck[ed.ck-2]; if(r){ while(r.length<11) r.push(""); r[8]=st; r[9]=rep; r[10]=dt; } }
    }
    const d0=ed.subs[0].d; $("modal").innerHTML=""; ed=null;
    if(appended){ selDay=d0; await pull(); } else { build(RAW); cset("sheet",RAW); render(); }
    if(FQ){ setTimeout(()=>fqNext(),350); }
    toast(!changed?"沒有偵測到變更，試算表沒有更新（如果你有改，請告訴 Claude 是改了哪一格）":confirmCk?"已確認並存到試算表":"已存到試算表");
  }catch(e){ if(btn) btn.disabled=false; toast("沒有寫入："+errMsg(e)); }
}

/* 類別／帳戶／對象 選擇面板 */
const TABS=["支出","收入","轉帳","應收款項","應付款項","系統"];
const tabFor=k=>k==="收入"?"收入":(k==="轉入"||k==="轉出"||k==="轉帳")?"轉帳":k==="應收款項"?"應收款項":k==="應付款項"?"應付款項":(k==="手續費"||k==="餘額調整")?"系統":"支出";
const TAGPAY=["#Line Pay","#Apple Pay"], TAGALI=["#支付寶","#微信支付"], ALIACC=new Set(["玉山Unicard","聯邦賴點卡"]), TAGCUBE=["#玩數位","#樂饗購","#趣旅行","#集精選"];
function tagFor(tg,a){ const ac=D.accounts.find(z=>z.n===a), acc=String(tg.acc||"全部").split(/[,，、]/).map(v=>v.trim()).filter(Boolean);
  return acc.includes("全部")||acc.includes(a)||(acc.includes("信用卡")&&ac&&ac.g==="信用卡"); }
function tagGroups(a){ const m=new Map(); for(const t of D.tags) if(tagFor(t,a)){ if(!m.has(t.g)) m.set(t.g,{g:t.g,one:false,l:[]}); const g=m.get(t.g); g.l.push(t.n); if(t.one) g.one=true; } return [...m.values()]; }
function allTags(){ const s=new Set(D.tags.map(t=>t.n)); for(const t of D.tx) if(t.tg) String(t.tg).split(";").forEach(v=>{ v=v.trim(); if(v) s.add(v); }); return [...s]; }
function tagHtml(x,dis){
  const cur=String(x.tg||"").split(";").map(v=>v.trim()).filter(Boolean), gs=tagGroups(x.a), known=new Set(gs.flatMap(g=>g.l)), extra=cur.filter(v=>!known.has(v));
  const chip=(v,grp)=>`<button class="tgc ${cur.includes(v)?"on":""}" data-tag="${esc(v)}" data-tgrp="${esc(grp)}"${dis}>${esc(v)}</button>`;
  let h=`<div class="tagbox"><div class="tgl"><span class="pic sm"><svg viewBox="0 0 24 24">${P.tag}</svg></span>標籤</div>`;
  for(const g of gs) h+=`<div class="tgg"><span class="tgn">${esc(g.g)}${g.one?"":"（可多選）"}</span>${g.l.map(v=>chip(v,g.g)).join("")}${g.one&&g.g.startsWith("Cube")?`<button class="tgc ${cur.some(v=>g.l.includes(v))?"":"on"}" data-tag="" data-tgrp="${esc(g.g)}"${dis}>空白</button>`:""}</div>`;
  if(extra.length) h+=`<div class="tgg"><span class="tgn">其他</span>${extra.map(v=>`<button class="tgc on old" data-tagx="${esc(v)}"${dis} title="點一下移除">${esc(v)} ✕</button>`).join("")}</div>`;
  if(!dis) h+=ed&&ed.tagAdd?`<div class="tgadd"><input id="e-tagnew" class="ein" list="tagsugg" placeholder="輸入標籤，例如 台灣Pay" autocomplete="off"><datalist id="tagsugg">${allTags().filter(v=>!cur.includes(v)).map(v=>`<option value="${esc(v)}">`).join("")}</datalist><button class="btn sm ok" id="tagaddgo">加入</button><button class="btn sm" id="tagaddx">取消</button></div><div class="tgn none">新的標籤會存進試算表「標籤」分頁，之後每個帳戶都點得到；要改分組或只給某些帳戶用，可以直接改那個分頁。</div>`
    :`<button class="tgc add" id="tagadd">＋ 新增標籤</button>`;
  return h+`</div>`;
}
function setTag(x,v,grp){
  let cur=String(x.tg||"").split(";").map(t=>t.trim()).filter(Boolean);
  const g=tagGroups(x.a).find(z=>z.g===grp), had=cur.includes(v);
  if(g&&g.one) cur=cur.filter(t=>!g.l.includes(t)); else cur=cur.filter(t=>t!==v);
  if(v&&!had) cur.push(v);
  const ord=new Map(D.tags.map((t,k)=>[t.n,k])); cur.sort((a,b)=>(ord.has(a)?ord.get(a):999)-(ord.has(b)?ord.get(b):999));
  x.tg=cur.join(";");
}
async function tagAddGo(){
  const inp=$("e-tagnew"); if(!inp) return; let v=inp.value.trim().replace(/[;；]/g,""); if(!v) { toast("請輸入標籤名稱"); return; }

  const x=ed.subs[ed.sel];

    if(!canWrite()) return;
    try{ const now=new Date(), stamp=iso(now);
      await call("append_values",{spreadsheetId:SID,range:"標籤!A1:E1",values:[[v,"其他","全部","",stamp.replace(/-/g,"/")+" 新增"]]});
      (RAW.tgs=RAW.tgs||[]).push([v,"其他","全部","",""]); D.tags.push({n:v,g:"其他",acc:"全部",one:false,ord:D.tags.length}); cset("sheet",RAW);

  ed.tagAdd=false; renderEd(); toast("已加上 "+v+"（記得按 ✓ 存檔）"); }

function setMove(spec){

    if(j<0||j>=arr.length) return; [arr[idx],arr[j]]=[arr[j],arr[idx]];
  } else {
    const mains=[...new Set(arr.filter(c=>c.tab===tab).map(c=>c.main))], k=mains.indexOf(m), k2=k+d;
    if(k2<0||k2>=mains.length) return; [mains[k],mains[k2]]=[mains[k2],mains[k]];
    const first=arr.findIndex(c=>c.tab===tab), block=mains.flatMap(mm=>arr.filter(c=>c.tab===tab&&c.main===mm));
    const rest=arr.filter(c=>c.tab!==tab); rest.splice(Math.min(first,rest.length),0,...block); SC.cat=rest;
  }

/* ── 同一筆（群組）顯示 ── */
const sameRec=(a,b)=>!!(a&&b&&a.d===b.d&&a.t===b.t&&(a.a===b.a||(/^轉/.test(a.k)&&/^轉/.test(b.k))));
/* 轉帳配對：先用「序號相連＋同時間」，剩下的再自動配對（同一天、金額相同、同幣別、不同帳戶、時間差 10 分鐘內，取最接近的） */
const isXf=t=>t.k==="轉出"||t.k==="轉入";
const hm=s=>{ const m=String(s||"").match(/(\d{1,2}):(\d{2})/); return m?Number(m[1])*60+Number(m[2]):0; };
function buildMates(tx){
  const mate=new Map(), auto=new Set(), byI=new Map(tx.map(t=>[t.i,t])), xs=tx.filter(isXf);
  for(const t of xs){ if(mate.has(t.i)) continue; for(const j of [t.i-1,t.i+1]){ const o=byI.get(j); if(o&&isXf(o)&&o.k!==t.k&&!mate.has(o.i)&&sameRec(t,o)){ mate.set(t.i,o); mate.set(o.i,t); break; } } }
  const byD=new Map(); for(const t of xs) if(!mate.has(t.i)){ if(!byD.has(t.d)) byD.set(t.d,[]); byD.get(t.d).push(t); }
  for(const l of byD.values()){ const outs=l.filter(t=>t.k==="轉出"), ins=l.filter(t=>t.k==="轉入"), cand=[];
    for(const o of outs) for(const n of ins){ if(o.a===n.a||o.cu!==n.cu) continue; if(Math.abs(Math.abs(tot(o))-Math.abs(tot(n)))>0.005) continue; const dt=Math.abs(hm(o.t)-hm(n.t)); if(dt<=10) cand.push([dt,Math.abs(o.i-n.i),o,n]); }
    cand.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    for(const [,,o,n] of cand){ if(mate.has(o.i)||mate.has(n.i)) continue; mate.set(o.i,n); mate.set(n.i,o); auto.add(o.i); auto.add(n.i); } }
  return {mate,auto}; }
function runs(list){ const out=[]; for(const t of list){ const r=out[out.length-1];
  if(r&&Math.abs(r[r.length-1].i-t.i)===1&&sameRec(r[0],t)) r.push(t); else out.push([t]); }
  // 自動配對的轉帳：兩邊都在這份清單裡就合成一筆
  if(!D||!D.mate) return out;
  const pos=new Map(); out.forEach((r,k)=>{ if(r.length===1) pos.set(r[0].i,k); });
  const drop=new Set();
  out.forEach((r,k)=>{ if(drop.has(k)||r.length!==1||!D.auto.has(r[0].i)) return; const m=D.mate.get(r[0].i), k2=m?pos.get(m.i):undefined;
    if(k2===undefined||k2===k||drop.has(k2)) return; const pair=[r[0],m].sort((a,b)=>a.k==="轉出"?-1:1); out[k]=pair; drop.add(k2); });
  return out.filter((r,k)=>!drop.has(k)); }
function grpHtml(list,opts){
  return runs(list).map(r=>{ if(r.length===1) return recHtml(r[0],opts);
    const sum=r.filter(t=>t.cu===r[0].cu).reduce((s,t)=>s+tot(t),0), xf=r.every(t=>/^轉/.test(t.k));
    const ag=xf&&r.length===2&&D.auto&&D.auto.has(r[0].i)&&r[0].t!==r[1].t;
    const lbl=xf?`轉帳 ${esc(r.find(t=>t.k==="轉出")?.a||"")} → ${esc(r.find(t=>t.k==="轉入")?.a||"")}${ag?`<span class="gauto">自動配對・時間差 ${Math.abs(hm(r[0].t)-hm(r[1].t))} 分</span>`:""}`:`同一筆・${r.length} 項`;
    return `<div class="grp" role="group" aria-label="${xf?"轉帳":"同一筆，"+r.length+" 項"}"><div class="grph"><span class="gl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H7a5 5 0 0 0 0 10h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>${lbl}</span>
      ${xf?"":`<span class="gsum ${sum<0?"n":sum>0?"p":""}">合計 ${esc(money(sum,r[0].cu))}</span>`}</div>${r.map(t=>recHtml(t,opts)).join("")}</div>`; }).join("");
}

function hay(t){

function dayClamp(y,m,d){ return Math.min(d,new Date(y,m,0).getDate()); }
function cycleOf(A,ref){

  const ex=ym=>D.cyc.find(c=>c.a===A.n&&c.ym===ym);
  const ymS=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
  const closeIn=(y,m)=>{ const e=ex(ymS(y,m)); return dayClamp(y,m,(e&&e.close)||A.close); };
  // 最近一次結帳日（<= 今天）
  let cy=y, cm=m; if(dd<closeIn(y,m)){ cm--; if(cm<1){cm=12;cy--;} }
  const end=`${ymS(cy,cm)}-${String(closeIn(cy,cm)).padStart(2,"0")}`;
  let py=cy, pm=cm-1; if(pm<1){pm=12;py--;}
  const start=addD(`${ymS(py,pm)}-${String(closeIn(py,pm)).padStart(2,"0")}`,1);

  if(e.target.id==="hq"){ const v=e.target.value; clearTimeout(aqt); aqt=setTimeout(()=>{ homeQ=v.trim(); hlim=80; applyHome(); },200); return; }
  if(e.target.id==="aq"){ const v=e.target.value; clearTimeout(aqt);
    aqt=setTimeout(()=>{auditQ=v;alim=50;render();
      const el=document.getElementById("aq"); if(el){el.focus();el.setSelectionRange(v.length,v.length)}},250); }
});

let sx=0,sy=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dy)>50) return;
  if(view==="cal"){ calStep(dx<0?1:-1); }
  else if(view==="acc"&&!acct&&!arapView){ full=dx<0; render(); }
  else if((acct||arapView)&&dx>0){ if(arapView&&arapOb){ arapOb=null; lim=60; render(); } else { acct=null; arapView=false; render(); } }
},{passive:true});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&src==="sheet"&&Date.now()-lastPull>180000) pull();
});
if(/recon|audit/.test(location.hash)){ view="audit";
  document.querySelectorAll("nav button[data-v]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v==="audit"))); }
load();
})();
</script>
